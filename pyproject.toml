[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "maze-individual"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.4",
    "pytest>=8.4.1",
    "maze-core==0.1.2",
]

[project.scripts]
maze = "maze.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
maze-core = { index = "course" } # hyphen (PEP 503 normalized)

[[tool.uv.index]]
name = "course"
url = "https://harvard-cs182-f25.github.io/maze/wheels/"
format = "simple"
explicit = true
